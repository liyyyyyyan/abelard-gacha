<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ABELARD GACHA</title>
    <link rel="stylesheet" href="/abelardsstype.css">
</head>
<body>
    <h1>Welcome, {{ user.username }}!</h1>
    <nav class="page-nav">
        <a href="/storage">Character Storage</a>
        <a href="/logout">Logout</a>
    </nav>
    <div class="gems">Gems: <span id="gems">{{ user.gems }}</span></div>
    <div style="margin:20px; font-size:20px; color:gold;">
        4★ Pity: <span id="pity4">{{ user.pity4 }}</span>/10<br>
        5★ Pity: <span id="pity5">{{ user.pity5 }}</span>/100
    </div>

    <button onclick="pull(1)">Single Pull (300)</button>
    <button onclick="pull(10)">10x Pull (2700)</button>
    <div id="result" style="margin:40px; min-height:200px;"></div>
    <audio id="five-star-sound" src="/audio/five-star.mp3" preload="auto"></audio>

    <script>
    function pull(times) {
        fetch('/api/pull', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'times=' + times
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
                return;
            }
            document.getElementById("gems").textContent = data.gems;
            document.getElementById("pity4").textContent = data.pity4;
            document.getElementById("pity5").textContent = data.pity5;
            document.getElementById("result").innerHTML = "";

            data.results.forEach((character, i) => {
                setTimeout(() => {
                    const card = document.createElement("div");
                    card.className = `card r${character.rarity} ${character.rarity >= 5 ? 'sparkle' : ''}`;
                    const image = document.createElement("img");
                    image.src = "/" + String(character.img || "images/Red.png").replace(/^\/+/, "");
                    image.alt = character.name;
                    const title = document.createElement("h3");
                    title.textContent = `${character.rarity}★ ${character.name}`;
                    card.append(image, title);
                    document.getElementById("result").appendChild(card);
                    if (character.rarity === 5) {
                        const sound = document.getElementById("five-star-sound");
                        sound.currentTime = 0;
                        sound.play().catch(error => {
                            console.warn("Unable to play the five-star sound.", error);
                        });
                    }
                }, i * 350);
            });
        })
        .catch(() => alert("Pull error — please try again."));
    }
    </script>
</body>
</html>
