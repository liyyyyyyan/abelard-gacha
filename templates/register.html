<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Register • Abelard Gacha</title>
    <style>
        body { background:#000 url("/images/dvd-logo.gif") center / cover fixed no-repeat; color:white; font-family:Arial; text-align:center; padding:100px; }
        input,button { padding:12px; margin:10px; width:250px; border-radius:50px; border:none; font-size:18px; }
    </style>
</head>
<body>
    <h1 style="color:gold">ABELARD GACHA</h1>
    <h2>Register</h2>
    {% if error %}<p role="alert" style="color:#ff8080">{{ error }}</p>{% endif %}
    {% if registered %}
        <p style="color:cyan">Registered! Gems: 10,000</p>
        <a href="/login">Login</a>
    {% else %}
        <form method="post" action="/register">
            <input name="username" placeholder="Username" autocomplete="username" required><br>
            <input name="password" type="password" placeholder="Password" autocomplete="new-password" required><br>
            <button type="submit">Create Account (10k gems free!)</button>
        </form>
    {% endif %}
    <br><a href="/login" style="color:cyan">Already have an account? Login here</a>
</body>
</html>
